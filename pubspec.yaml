name: gif_loop
description: Search, explore and play with GIPHY GIFs frame by frame.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  envied: ^1.3.10
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
